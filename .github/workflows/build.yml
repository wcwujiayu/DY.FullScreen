name: Build DY.FullScreen

on:
  push:
    # 'refactor/**' lets a feature branch produce its own dylib from Actions
    # artifacts without publishing it to main. Remove this line if you only
    # ever want main and tags to build.
    branches: [main, 'refactor/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run repository static checks
        run: bash .github/scripts/static-checks.sh

  build:
    name: Build rootful, rootless, roothide and dylib
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install packaging utilities
        run: brew install dpkg

      - name: Prepare output folders
        run: rm -rf packages dist && mkdir -p packages dist

      # Single source of truth: the version comes from control only. Previously
      # the file names below hard-coded it, so bumping control silently broke
      # the mv steps with "Expected one package, got 0".
      - name: Read package version
        id: pkgver
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ {print $2; exit}' control)"
          if [ -z "$version" ]; then
            echo "无法从 control 文件读取 Version 字段" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Build rootful package
        shell: bash
        env:
          VERSION: ${{ steps.pkgver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf packages && mkdir -p packages
          make package SCHEME=rootful FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          shopt -s nullglob
          files=(packages/*.deb)
          if [ "${#files[@]}" -ne 1 ]; then echo "Expected one rootful package, got ${#files[@]}" >&2; exit 1; fi
          mv "${files[0]}" "dist/com.dy.fullscreen_${VERSION}_iphoneos-arm-rootful.deb"

      - name: Build rootless package
        shell: bash
        env:
          VERSION: ${{ steps.pkgver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf packages .theos && mkdir -p packages
          make package SCHEME=rootless FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          shopt -s nullglob
          files=(packages/*.deb)
          if [ "${#files[@]}" -ne 1 ]; then echo "Expected one rootless package, got ${#files[@]}" >&2; exit 1; fi
          mv "${files[0]}" "dist/com.dy.fullscreen_${VERSION}_iphoneos-arm64-rootless.deb"

      - name: Build roothide package
        shell: bash
        env:
          VERSION: ${{ steps.pkgver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf packages .theos && mkdir -p packages
          make package SCHEME=roothide FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          shopt -s nullglob
          files=(packages/*.deb)
          if [ "${#files[@]}" -ne 1 ]; then echo "Expected one roothide package, got ${#files[@]}" >&2; exit 1; fi
          mv "${files[0]}" "dist/com.dy.fullscreen_${VERSION}_iphoneos-arm64e-roothide.deb"

      - name: Export dylib and checksums
        shell: bash
        env:
          VERSION: ${{ steps.pkgver.outputs.version }}
        run: |
          set -euo pipefail
          # Locate the rootless package by pattern instead of a hard-coded name.
          rootless_deb="$(find dist -type f -name '*_iphoneos-arm64-rootless.deb' -print -quit)"
          if [[ -z "$rootless_deb" ]]; then
            echo "rootless package not found in dist" >&2
            ls -lah dist >&2 || true
            exit 1
          fi
          stage="$RUNNER_TEMP/dy-fullscreen-rootless"
          rm -rf "$stage" && mkdir -p "$stage"
          dpkg-deb -x "$rootless_deb" "$stage"
          dylib="$(find "$stage" -type f -name 'DY.FullScreen.dylib' -print -quit)"
          if [[ -z "$dylib" ]]; then
            echo "DY.FullScreen.dylib not found inside rootless package" >&2
            find "$stage" -type f -print >&2 || true
            exit 1
          fi
          # 只保留带版本号的 dylib：无版本号副本与 TrollFools zip 容易与
          # 其他版本混淆，已按维护者要求移除。
          cp "$dylib" "dist/DY.FullScreen_${VERSION}.dylib"
          (cd dist && shasum -a 256 *.deb *.dylib > SHA256SUMS.txt)
          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DY.FullScreen-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DY.FullScreen ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
